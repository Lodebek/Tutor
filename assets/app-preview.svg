        <rect x="111" y="0" width="103" height="48" rx="11" fill="#1e293b"/><text x="162.5" y="30" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="middle">2</text>
        <rect x="222" y="0" width="103" height="48" rx="11" fill="#1e293b"/><text x="273.5" y="30" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="middle">3</text>

