      <rect x="14" y="124" width="297" height="36" rx="9" fill="rgba(245,158,11,0.16)" stroke="rgba(251,191,36,0.4)"/>
      <text x="162.5" y="146" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#fde68a" text-anchor="middle">💡 Square + 1 Group: (7 × 7 = 49) + 7 more = 56</text>

