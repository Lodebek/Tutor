        <rect x="111" y="55" width="103" height="48" rx="11" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="162.5" y="85" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#38bdf8" text-anchor="middle">5</text>
        <rect x="222" y="55" width="103" height="48" rx="11" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="273.5" y="85" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#38bdf8" text-anchor="middle">6</text>

        <rect x="0" y="110" width="103" height="48" rx="11" fill="#1e293b"/><text x="51.5" y="140" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="middle">7</text>
        <rect x="111" y="110" width="103" height="48" rx="11" fill="#1e293b"/><text x="162.5" y="140" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="middle">8</text>
        <rect x="222" y="110" width="103" height="48" rx="11" fill="#1e293b"/><text x="273.5" y="140" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="middle">9</text>

        <rect x="0" y="165" width="103" height="48" rx="11" fill="rgba(239,68,68,0.15)"/><text x="51.5" y="194" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#fca5a5" text-anchor="middle">CLR / ⌫</text>
        <rect x="111" y="165" width="103" height="48" rx="11" fill="#1e293b"/><text x="162.5" y="195" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="middle">0</text>
