      <text x="51.5" y="14" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#94a3b8" text-anchor="middle">CLEARED</text>
      <text x="51.5" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#f8fafc" text-anchor="middle">6 / 15</text>

      <rect x="111" y="0" width="103" height="38" rx="8" fill="#172033" stroke="rgba(255,255,255,0.08)"/>
      <text x="162.5" y="14" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#94a3b8" text-anchor="middle">PILE LEFT</text>
      <text x="162.5" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#f8fafc" text-anchor="middle">9</text>

      <rect x="222" y="0" width="103" height="38" rx="8" fill="#172033" stroke="rgba(255,255,255,0.08)"/>
      <text x="273.5" y="14" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#94a3b8" text-anchor="middle">STREAK</text>
      <text x="273.5" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#f8fafc" text-anchor="middle">🔥 6</text>
